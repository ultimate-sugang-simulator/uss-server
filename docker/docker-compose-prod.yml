version: '3.8'

services:
  uss-server-prod:
    container_name: uss-server-prod
    image: ${DOCKER_HUB_USERNAME}/uss-server:prod
    ports:
      - "8181:8080"   # 관리 포트(8081)는 공개하지 않는다. 같은 네트워크의 Prometheus만 접근한다.
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - uss-prod
    volumes:
      - ./logs:/var/log/spring

  uss-loki:
    container_name: uss-loki
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - uss-prod
    volumes:
      - ./infra/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    user: root

  uss-alloy:
    container_name: uss-alloy
    image: grafana/alloy:latest
    command: [ "run", "/etc/alloy/config.alloy" ]
    environment:
      - TZ=Asia/Seoul
      - ALLOY_ENV=prod
    networks:
      - uss-prod
    volumes:
      - ./logs:/var/log/spring:ro
      - ./infra/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - uss-loki

networks:
  uss-prod:
    external: true
    name: uss-prod

volumes:
  loki_data:
