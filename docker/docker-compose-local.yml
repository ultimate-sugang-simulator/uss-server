version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: uss-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uss_db
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - uss_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --ngram_token_size=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uss_mysql_data:
    driver: local