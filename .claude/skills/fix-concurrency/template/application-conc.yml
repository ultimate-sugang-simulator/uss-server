spring:
  application:
    name: uss-server-conc

  datasource:
    # docker-compose-local.yml의 mysql 서비스. 호스트 포트가 3307이다(3306 아님).
    url: jdbc:mysql://127.0.0.1:3307/uss_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root
    # p6spy 드라이버를 쓰지 마라. 쿼리마다 프록시를 한 겹 태우면
    # 그 오버헤드가 임계 구역 체류 시간에 그대로 들어가 경합 양상 자체를 바꾼다.
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # **부하 VU 이상으로 잡는다.** 풀이 VU보다 작으면 요청이 락이 아니라 커넥션을 기다리게 되고,
      # 그러면 경합이 줄어들어 결함이 재현되지 않는다. 값을 바꾸면 record.md의 측정 환경에 남긴다.
      maximum-pool-size: 200
      minimum-idle: 200
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        generate_statistics: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:database/migration
      - classpath:database/seed

security:
  jwt:
    # HS256 서명에 32바이트 이상이 필요하다.
    # Phase 3의 mint-tokens.sh가 이 값을 그대로 읽어 토큰을 만든다. 바꾸면 토큰도 다시 만든다.
    secret-key: conc-only-local-secret-key-not-for-any-real-environment
    access-token-expiration-time: 86400000
    admin-access-token-expiration-time: 86400000

inu:
  course-api:
    base-url: http://localhost/unused-in-conc-profile
    auth-key: unused
    mod-date: "20260101"

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: uss-server-conc

logging:
  level:
    root: WARN
    uss.code: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    p6spy: OFF
