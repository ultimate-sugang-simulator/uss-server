name: "🐛 fix"
description: "버그 수정"
labels: ["fix"]
body:
  - type: textarea
    attributes:
      label: 📄 버그 설명
      description: 발생한 버그에 대한 설명을 작성해 주세요.
      placeholder: 어떤 버그가 발생했나요?
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 작업할 내용
      description: 버그를 수정하기 위한 작업 내용을 작성해주세요.
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
        - [ ] 작업 3
    validations:
      required: true
  - type: textarea
    attributes:
      label: 💬 논의해볼 사항
      description: 추후 논의가 필요한 사항이 있다면 작성해 주세요.
      placeholder: 원인 분석, 수정 방향, 테스트 전략 등