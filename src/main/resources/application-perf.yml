# 성능 측정 전용 프로파일. 원본은 .claude/skills/optimize-performance/template/application-perf.yml 이다.
#
# 목적은 하나다. 측정값을 왜곡하는 요소를 전부 끄는 것. 값을 바꿀 때는 주석의 이유를 먼저 읽어라.
#
# 기동: ./gradlew bootRun --args='--spring.profiles.active=perf'
# 선행: docker-compose -f docker/docker-compose-local.yml up -d mysql

spring:
  application:
    name: uss-server-perf

  datasource:
    # docker-compose-local.yml의 mysql. 호스트 포트는 3307이다.
    url: jdbc:mysql://127.0.0.1:3307/uss_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: root
    password: root
    # p6spy 드라이버를 쓰지 마라. 쿼리마다 프록시 한 겹의 오버헤드가 측정값에 들어간다.
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # Phase 3-B에서 VU를 정할 때 이 값을 함께 본다. 풀보다 훨씬 큰 VU는 커넥션 대기를 잰다.
      # 바꾸면 record.md의 측정 환경에 시점과 함께 남긴다.
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 10000
      # 측정 중 커넥션이 재생성되면 그 지연이 응답시간에 섞인다.
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # SQL 로깅은 요청당 수십 줄을 찍는다. 측정값을 통째로 바꾼다.
        format_sql: false
        show_sql: false
        # 통계 수집도 오버헤드다. 쿼리 관측은 performance_schema로 한다.
        generate_statistics: false
    show-sql: false
    # 뷰 렌더링이 없다. 열려 있으면 커넥션 점유 구간이 실제보다 길어진다.
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:database/migration
      - classpath:database/seed

inu:
  course-api:
    # InuCourseApiProperties가 바인딩한다. 연계 API는 IP 화이트리스트라 로컬에서 호출되지 않는다. 기동에 필요한 자리만 채운다.
    base-url: http://localhost/unused-in-perf-profile
    auth-key: unused
    mod-date: "20260101"

security:
  jwt:
    # 로컬 측정 전용 키. perf-env.sh가 이 값을 읽어 토큰을 만든다. 바꾸면 토큰도 다시 만든다. 32바이트 이상.
    secret-key: perf-only-local-secret-key-not-for-any-real-environment
    # JwtProvider 생성자가 요구하는 두 키. 측정 중 만료되면 401이 섞이므로 넉넉히 잡는다.
    access-token-expiration-time: 86400000
    admin-access-token-expiration-time: 86400000

management:
  server:
    # Phase 2의 actuator 확인 명령이 8081을 본다.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: uss-server-perf
    distribution:
      # 없으면 Phase 2의 히스토그램 버킷 확인이 0으로 나온다.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1s,2s,5s

logging:
  level:
    root: WARN
    uss.code: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    p6spy: OFF
