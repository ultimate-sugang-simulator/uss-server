spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none

security:
  jwt:
    secret-key: test-secret-key-for-unit-testing-purposes-only
    access-token-expiration-time: 21600000
    admin-access-token-expiration-time: 7200000

inu:
  course-api:
    base-url: http://localhost/test-inu-api
    auth-key: test-auth-key
    mod-date: "20260101"
