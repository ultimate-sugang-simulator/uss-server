spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@test.com
    password: test
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true

security:
  jwt:
    secret-key: test-secret-key-for-unit-testing-purposes-only
    access-token-expiration-time: 21600000
    refresh-token-expiration-time: 259200000
